name: Build BloodMesh Gothic Headscale VPN IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'BloodMesh/**'
      - 'WidgetPack/BloodMeshWidget/**'
      - 'WidgetPack/Shared/**'
      - '.github/workflows/build-bloodmesh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bloodmesh:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build BloodMesh + Widget
        working-directory: BloodMesh
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project BloodMesh.xcodeproj \
            -target BloodMesh \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into BloodMesh.ipa
        working-directory: BloodMesh
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/BloodMesh.app" out/Payload/
          cd out && zip -r9 BloodMesh.ipa Payload

      - name: Upload BloodMesh IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodMesh-ipa
          path: BloodMesh/out/BloodMesh.ipa
          if-no-files-found: error
