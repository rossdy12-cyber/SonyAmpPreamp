name: Build DukePulse IPA (KTM Duke 125 OBD2 Reader)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'DukePulse/**'
      - '.github/workflows/build-dukepulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dukepulse:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build DukePulse (Unsigned)
        working-directory: DukePulse
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project DukePulse.xcodeproj \
            -target DukePulse \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into DukePulse.ipa
        working-directory: DukePulse
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/DukePulse.app" out/Payload/
          cd out && zip -r9 DukePulse.ipa Payload

      - name: Upload DukePulse IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DukePulse-ipa
          path: DukePulse/out/DukePulse.ipa
          if-no-files-found: error
