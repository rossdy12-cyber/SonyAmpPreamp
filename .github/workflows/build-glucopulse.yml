name: Build GlucoPulse IPA (with WidgetKit Extension)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'GlucoPulse/**'
      - '.github/workflows/build-glucopulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-glucopulse:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build GlucoPulse + GlucoPulseWidget
        working-directory: GlucoPulse
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project GlucoPulse.xcodeproj \
            -target GlucoPulse \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into GlucoPulse.ipa
        working-directory: GlucoPulse
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/GlucoPulse.app" out/Payload/
          ls -la "out/Payload/GlucoPulse.app/PlugIns"
          cd out && zip -r9 GlucoPulse.ipa Payload

      - name: Upload GlucoPulse IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPulse-ipa
          path: GlucoPulse/out/GlucoPulse.ipa
          if-no-files-found: error
