name: Build Knell IPA (Gothic Ringtone Forge)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Knell/**'
      - '.github/workflows/build-knell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-knell:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Knell (Unsigned)
        working-directory: Knell
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Knell.xcodeproj \
            -target Knell \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Knell.ipa
        working-directory: Knell
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Knell.app" out/Payload/
          cd out && zip -r9 Knell.ipa Payload

      - name: Upload Knell IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knell-ipa
          path: Knell/out/Knell.ipa
          if-no-files-found: error
