name: Build Oracle IPA (DeepAI Code anywhere)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Oracle/**'
      - '.github/workflows/build-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-oracle:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Oracle (Unsigned)
        working-directory: Oracle
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -project Oracle.xcodeproj -scheme Oracle -configuration Release -destination 'generic/platform=iOS' -archivePath build/Oracle.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -30

      - name: Package Unsigned IPA
        working-directory: Oracle
        run: |
          APP_PATH=$(find build/Oracle.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Oracle-unsigned.ipa Payload
          ls -la Oracle-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-ipa
          path: Oracle/Oracle-unsigned.ipa

      - name: Publish to Stark Store (GitHub release relay)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import zipfile,plistlib; z=zipfile.ZipFile('Oracle/Oracle-unsigned.ipa'); info=[n for n in z.namelist() if n.endswith('.app/Info.plist')][0]; print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])")
          ASSET="Oracle__app.ross.oracle__${VER}.ipa"
          cp Oracle/Oracle-unsigned.ipa "$ASSET"
          gh release view store-upload --repo rossdy12-cyber/SonyAmpPreamp >/dev/null 2>&1 ||             gh release create store-upload --repo rossdy12-cyber/SonyAmpPreamp --title "Stark Store upload relay" --notes "Unsigned IPAs for the NAS relay to sign and publish"
          gh release upload store-upload "$ASSET" --repo rossdy12-cyber/SonyAmpPreamp --clobber
          echo "RELEASED: $ASSET - the NAS relay will sign and publish it within ~2 minutes"
