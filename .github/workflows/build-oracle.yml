name: Build Oracle IPA (DeepAI Code anywhere)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Oracle/**'
      - '.github/workflows/build-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-oracle:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Oracle (Unsigned)
        working-directory: Oracle
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -project Oracle.xcodeproj -scheme Oracle -configuration Release -destination 'generic/platform=iOS' -archivePath build/Oracle.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -30

      - name: Package Unsigned IPA
        working-directory: Oracle
        run: |
          APP_PATH=$(find build/Oracle.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Oracle-unsigned.ipa Payload
          ls -la Oracle-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-ipa
          path: Oracle/Oracle-unsigned.ipa

      - name: Sign and Publish to Stark Store
        if: github.ref == 'refs/heads/main'
        working-directory: Oracle
        env:
          UPL_TOKEN: ${{ secrets.SIDESTORE_UPLOAD_TOKEN }}
        run: |
          VER=$(python3 -c "import zipfile,plistlib; z=zipfile.ZipFile('Oracle-unsigned.ipa'); info=[n for n in z.namelist() if n.endswith('.app/Info.plist')][0]; print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])")
          echo "Uploading Oracle v$VER to the store..."
          RESP=$(curl -s --max-time 120 -X POST -H "User-Agent: stark-actions/1.0" --data-binary @Oracle-unsigned.ipa "https://navidrome.nas-server.co.uk/sidestore-api/upload-ipa?name=Oracle&bundleId=app.ross.oracle&version=$VER&token=$UPL_TOKEN")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' && echo "PUBLISHED: Oracle v$VER is signed and live in the store"

