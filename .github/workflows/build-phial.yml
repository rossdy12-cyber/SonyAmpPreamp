name: Build Phial IPA (Gothic Medication Reminders)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Phial/**'
      - '.github/workflows/build-phial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-phial:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Phial (Unsigned)
        working-directory: Phial
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Phial.xcodeproj \
            -target Phial \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Phial.ipa
        working-directory: Phial
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Phial.app" out/Payload/
          cd out && zip -r9 Phial.ipa Payload

      - name: Upload Phial IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phial-ipa
          path: Phial/out/Phial.ipa
          if-no-files-found: error
