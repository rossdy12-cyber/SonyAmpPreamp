name: Build Pulseline IPA (Gothic Health Explorer)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Pulseline/**'
      - '.github/workflows/build-pulseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pulseline:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Pulseline (Unsigned)
        working-directory: Pulseline
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Pulseline.xcodeproj \
            -target Pulseline \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Pulseline.ipa
        working-directory: Pulseline
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Pulseline.app" out/Payload/
          cd out && zip -r9 Pulseline.ipa Payload

      - name: Upload Pulseline IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulseline-ipa
          path: Pulseline/out/Pulseline.ipa
          if-no-files-found: error
