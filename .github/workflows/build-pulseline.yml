name: Build Pulseline IPA (Gothic Health Explorer + Widget)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Pulseline/**'
      - '.github/workflows/build-pulseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pulseline:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Pulseline (Unsigned)
        working-directory: Pulseline
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Pulseline.xcodeproj \
            -target Pulseline \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Pulseline.ipa
        working-directory: Pulseline
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Pulseline.app" out/Payload/
          ls -la "out/Payload/Pulseline.app/PlugIns" || true
          cd out && zip -r9 Pulseline.ipa Payload

      - name: Upload Pulseline IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulseline-ipa
          path: Pulseline/out/Pulseline.ipa
          if-no-files-found: error

      - name: Publish IPA to store-upload release (NAS relay signs + publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Pulseline
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Release-iphoneos/Pulseline.app/Info.plist)
          IPA="Pulseline__app.pulseline.health__${VERSION}.ipa"
          cp out/Pulseline.ipa "out/${IPA}"
          TAG="store-upload"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Store Upload" --notes "Unsigned IPAs for the NAS relay to sign and publish"
          fi
          gh release upload "$TAG" "out/${IPA}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "RELEASED: ${IPA} - the NAS relay will sign and publish it."

