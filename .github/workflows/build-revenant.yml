name: Build Revenant IPA (Gothic Vertical Cinema)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Revenant/**'
      - '.github/workflows/build-revenant.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-revenant:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Revenant (Unsigned)
        working-directory: Revenant
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Revenant.xcodeproj \
            -target Revenant \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Revenant.ipa
        working-directory: Revenant
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Revenant.app" out/Payload/
          cd out && zip -r9 Revenant.ipa Payload

      - name: Upload Revenant IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revenant-ipa
          path: Revenant/out/Revenant.ipa
          if-no-files-found: error
