name: Build Stark Store TV (tvOS Apple TV) IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'StarkStoreTV/**'
      - '.github/workflows/build-starkstoretv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-starkstoretv:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Stark Store TV (appletvos)
        working-directory: StarkStoreTV
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project StarkStoreTV.xcodeproj \
            -target StarkStoreTV \
            -configuration Release \
            -sdk appletvos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into StarkStoreTV.ipa
        working-directory: StarkStoreTV
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-appletvos/StarkStoreTV.app" out/Payload/
          cd out && zip -r9 StarkStoreTV.ipa Payload

      - name: Upload StarkStoreTV IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarkStoreTV-ipa
          path: StarkStoreTV/out/StarkStoreTV.ipa
          if-no-files-found: error
