name: Build Warden IPA (Gothic PC Unlock)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Warden/**'
      - '.github/workflows/build-warden.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warden-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-warden:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Warden (Unsigned)
        working-directory: Warden
        run: |
          set -euo pipefail
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project Warden.xcodeproj \
            -target Warden \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build WardenWatch (watchOS Companion App) & Package Payload into Warden.ipa
        working-directory: Warden
        run: |
          set -euo pipefail
          COMPANION_ID="com.ross.warden" COMPANION_APP_PATH="build/Release-iphoneos/Warden.app" bash ./build-watch.sh
          test -f "build/Release-iphoneos/Warden.app/Watch/WardenWatch.app/WardenWatch"
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Warden.app" out/Payload/
          ls -la "out/Payload/Warden.app/Watch/WardenWatch.app"
          cd out && zip -r9 Warden.ipa Payload
          rm -rf Payload

      - name: Upload Warden IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warden-ipa
          path: Warden/out/Warden.ipa
          if-no-files-found: error

      - name: Publish IPA to store-upload release (NAS relay signs + publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Warden
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Release-iphoneos/Warden.app/Info.plist)
          IPA="Warden__com.ross.warden__${VERSION}.ipa"
          cp out/Warden.ipa "out/${IPA}"
          TAG="store-upload"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Store Upload" --notes "Unsigned IPAs for the NAS relay to sign and publish"
          fi
          gh release upload "$TAG" "out/${IPA}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "RELEASED: ${IPA} - the NAS relay will sign and publish it."
