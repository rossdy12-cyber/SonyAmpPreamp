name: Build VoltGuard v1.2.0 Auto-Guardian IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VoltGuard/**'
      - 'WidgetPack/**'
      - '.github/workflows/build-widgets-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-widgets-pack:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build VoltGuard v1.2.0 + VoltGuardWidget Extension
        working-directory: VoltGuard
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild build \
            -project VoltGuard.xcodeproj \
            -target VoltGuard \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/VoltGuard.app" out/Payload/
          ls -la "out/Payload/VoltGuard.app/PlugIns"
          cd out && zip -r9 VoltGuard.ipa Payload

      - name: Upload VoltGuard IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltGuard-ipa
          path: VoltGuard/out/VoltGuard.ipa
          if-no-files-found: error
