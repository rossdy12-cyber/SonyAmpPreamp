name: Build Wraith IPA (Headscale overseer)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Wraith/**'
      - '.github/workflows/build-wraith.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wraith:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Build Wraith (Unsigned)
        working-directory: Wraith
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -project Wraith.xcodeproj -scheme Wraith -configuration Release -destination 'generic/platform=iOS' -archivePath build/Wraith.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -30

      - name: Package Unsigned IPA
        working-directory: Wraith
        run: |
          APP_PATH=$(find build/Wraith.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Wraith-unsigned.ipa Payload
          ls -la Wraith-unsigned.ipa

      - name: Publish to Stark Store (GitHub release relay)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import zipfile,plistlib; z=zipfile.ZipFile('Wraith/Wraith-unsigned.ipa'); info=[n for n in z.namelist() if n.endswith('.app/Info.plist')][0]; print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])")
          ASSET="Wraith__app.ross.wraith__${VER}.ipa"
          cp Wraith/Wraith-unsigned.ipa "$ASSET"
          gh release view store-upload --repo rossdy12-cyber/SonyAmpPreamp >/dev/null 2>&1 || \
            gh release create store-upload --repo rossdy12-cyber/SonyAmpPreamp --title "Stark Store upload relay" --notes "Unsigned IPAs for the NAS relay to sign and publish"
          gh release upload store-upload "$ASSET" --repo rossdy12-cyber/SonyAmpPreamp --clobber
          echo "RELEASED: $ASSET - the NAS relay will sign and publish it within ~2 minutes"
