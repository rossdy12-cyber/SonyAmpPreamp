name: BloodMesh
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  BloodMesh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BloodMesh
      - path: ../WidgetPack/Shared
    dependencies:
      - target: BloodMeshWidget
      - target: BloodMeshTunnel
    settings:
      base:
        PRODUCT_NAME: BloodMesh
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.bloodmesh
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: BloodMesh/Info.plist
      properties:
        CFBundleDisplayName: "BloodMesh"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.ross.bloodmesh
            CFBundleURLSchemes:
              - bloodmesh
        NSLocalNetworkUsageDescription: "BloodMesh establishes your native Headscale mesh tunnel (100.64.0.0/10) and routes traffic to your home LAN (192.168.0.0/24)."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  BloodMeshTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BloodMeshTunnel
    settings:
      base:
        PRODUCT_NAME: BloodMeshTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.bloodmesh.tunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: BloodMeshTunnel/Info.plist
      properties:
        CFBundleDisplayName: BloodMeshTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

  BloodMeshWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../WidgetPack/BloodMeshWidget
      - path: ../WidgetPack/Shared
    settings:
      base:
        PRODUCT_NAME: BloodMeshWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.bloodmesh.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: ../WidgetPack/BloodMeshWidget/Info.plist
      properties:
        CFBundleDisplayName: BloodMesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
