name: Coven
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Coven:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Coven
        excludes:
          - "**/*.md"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.coven
        PRODUCT_NAME: Coven
        INFOPLIST_KEY_CFBundleDisplayName: "Coven"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Coven scans your local network to discover and control your smart home devices."
        INFOPLIST_KEY_NSBonjourServices: "_http._tcp _https._tcp _homekit._tcp _hap._tcp _googlecast._tcp _shelly._tcp _esphomelib._tcp _mqtt._tcp _home-assistant._tcp"
    info:
      path: Coven/Info.plist
      properties:
        CFBundleDisplayName: "Coven"
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocalNetworkUsageDescription: "Coven scans your local network to discover and control your smart home devices."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _homekit._tcp
          - _hap._tcp
          - _googlecast._tcp
          - _shelly._tcp
          - _esphomelib._tcp
          - _mqtt._tcp
          - _home-assistant._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
