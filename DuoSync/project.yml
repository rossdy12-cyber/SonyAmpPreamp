name: DuoSync
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DuoSync:
    type: application
    platform: iOS
    sources:
      - path: DuoSync
    settings:
      base:
        PRODUCT_NAME: DuoSync
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.duosync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: DuoSync/Info.plist
      properties:
        CFBundleDisplayName: DuoSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: DuoSync talks to your PCs over Tailscale to keep these folders in step.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ross.duosync.refresh

  DuoSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DuoSyncTests
      - path: DuoSync/Core/Engine.swift
      - path: DuoSync/Core/Models.swift
      - path: DuoSync/Core/Hasher.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.duosync.tests
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  DuoSyncTests:
    build:
      targets:
        DuoSyncTests: all
    test:
      targets:
        - DuoSyncTests
