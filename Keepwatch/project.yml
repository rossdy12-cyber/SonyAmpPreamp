name: Keepwatch
options:
  bundleIdPrefix: app.keepwatch
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  Keepwatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: KeepwatchWidget
    sources:
      - path: App
      - path: Views
      - path: Resources
        excludes:
          - Info.plist
          - InfoTV.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: app.keepwatch.nasdashboard
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "21"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  KeepwatchTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Views
      - path: Resources
        excludes:
          - Info.plist
          - InfoTV.plist
    settings:
      base:
        PRODUCT_NAME: KeepwatchTV
        TARGETED_DEVICE_FAMILY: "3"
        PRODUCT_BUNDLE_IDENTIFIER: app.keepwatch.nasdashboard.tv
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "21"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Resources/InfoTV.plist
      properties:
        CFBundleDisplayName: Keepwatch TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  KeepwatchWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeepwatchWidget
    settings:
      base:
        PRODUCT_NAME: KeepwatchWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.keepwatch.nasdashboard.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: KeepwatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Keepwatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
