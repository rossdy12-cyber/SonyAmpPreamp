name: Knell
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Knell:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Knell
        excludes:
          - "**/*.md"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.knell
        PRODUCT_NAME: Knell
        INFOPLIST_KEY_CFBundleDisplayName: "Knell"
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "24"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    info:
      path: Knell/Info.plist
      properties:
        CFBundleDisplayName: "Knell"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ross.knell.ringtone
            UTTypeDescription: "Knell Ringtone"
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - m4r
              public.mime-type:
                - audio/m4r
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Knell Ringtone"
            LSHandlerRank: "Owner"
            LSItemContentTypes:
              - com.ross.knell.ringtone
