name: NASFiles
options:
  bundleIdPrefix: uk.co.rossdymond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  NASFiles:
    type: application
    platform: iOS
    sources:
      - NASFiles
    info:
      path: NASFiles/Info.plist
      properties:
        CFBundleDisplayName: NAS Vault
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "VaultScan uses your camera to scan documents and receipts with Apple Vision OCR."
        NSPhotoLibraryUsageDescription: "PhotoVault & VaultScan import photos for OCR indexing and encrypted enclave storage."
        NSFaceIDUsageDescription: "PhotoVault Enclave uses Face ID to protect your private photos and credentials."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.nasfiles
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
