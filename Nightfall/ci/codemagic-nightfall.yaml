workflows:
  nightfall-ios-ipa:
    name: Nightfall iPhone Browser — Build, Sign & Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes:
          - 'Nightfall/**'
          - 'codemagic.yaml'
    scripts:
      - name: Build unsigned Nightfall IPA on M2 and publish through TrueNAS
        script: |
          bash Nightfall/ci/build-and-publish.sh
    artifacts:
      - Nightfall/Nightfall.ipa
      - Nightfall/build-tail.log
      - Nightfall/publish-result.json