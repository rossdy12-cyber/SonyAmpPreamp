name: Oracle
options:
  bundleIdPrefix: app.ross
  deploymentTarget:
    iOS: "16.0"
targets:
  Oracle:
    type: application
    platform: iOS
    sources:
      - Oracle
    settings:
      base:
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: app.ross.oracle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: G42YL9QS8W
    info:
      path: Oracle/Info.plist
      properties:
        CFBundleDisplayName: Oracle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Oracle talks to your DeepAI Code agent on the TrueNAS over LAN and Tailscale."
