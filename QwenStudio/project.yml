name: QwenStudio
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  QwenStudio:
    type: application
    platform: iOS
    sources:
      - path: QwenStudio
    settings:
      base:
        PRODUCT_NAME: QwenStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.qwenstudio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: QwenStudio/Info.plist
      properties:
        CFBundleDisplayName: "CoreDiag"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: "CoreDiag uses Face ID to unlock administrator telemetry."
        NSPhotoLibraryAddUsageDescription: "CoreDiag exports diagnostic snapshots to your library when requested."
        NSPhotoLibraryUsageDescription: "CoreDiag imports reference images for calibration."
        NSLocalNetworkUsageDescription: "CoreDiag connects to your local TrueNAS and PC nodes over Wi-Fi or Tailscale."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
