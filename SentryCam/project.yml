name: SentryCam
options:
  bundleIdPrefix: app.sentrycam
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  SentryCam:
    type: application
    platform: iOS
    sources:
      - path: SentryCam
        excludes:
          - "Info.plist"
          - "InfoTV.plist"
    settings:
      base:
        PRODUCT_NAME: SentryCam
        PRODUCT_BUNDLE_IDENTIFIER: app.sentrycam.nvr
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: SentryCam/Info.plist
      properties:
        CFBundleDisplayName: "SentryCam"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "SentryCam streams live Frigate NVR cameras, clips, and PTZ controls from your TrueNAS server."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - remote-notification
          - fetch
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  SentryCamTV:
    type: application
    platform: tvOS
    sources:
      - path: SentryCam
        excludes:
          - "Info.plist"
          - "InfoTV.plist"
    settings:
      base:
        PRODUCT_NAME: SentryCamTV
        PRODUCT_BUNDLE_IDENTIFIER: app.sentrycam.nvr.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: SentryCam/InfoTV.plist
      properties:
        CFBundleDisplayName: "SentryCam TV"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "SentryCam TV streams live Frigate NVR cameras, clips, and PTZ controls from your TrueNAS server."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
