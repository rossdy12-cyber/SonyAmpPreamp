name: Tether
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Tether:
    type: application
    platform: iOS
    sources:
      - path: Tether
    settings:
      base:
        PRODUCT_NAME: Tether
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.tether
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Tether.entitlements
    info:
      path: Tether/Info.plist
      properties:
        CFBundleDisplayName: Tether
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationAlwaysAndWhenInUseUsageDescription: Tether shares your location with the people in your circle, even when the app is closed, so they can see where you are and get arrival and departure alerts.
        NSLocationWhenInUseUsageDescription: Tether uses your location to show you on the map and share it with the people in your circle.
        NSMotionUsageDescription: Tether uses motion data to tell whether you are walking, driving or still, which saves battery and labels your trips.
        UIBackgroundModes:
          - location
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.ross.tether.refresh
