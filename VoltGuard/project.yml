name: VoltGuard
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "5"

targets:
  VoltGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoltGuard
    dependencies:
      - target: VoltGuardWidget
    settings:
      base:
        PRODUCT_NAME: VoltGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.voltguard
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: VoltGuard/Info.plist
      properties:
        CFBundleDisplayName: "VoltGuard"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
          - processing
        NSLocalNetworkUsageDescription: "VoltGuard audits TrueNAS and Tailscale background sockets and media streams to stop hidden battery drain."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  VoltGuardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../WidgetPack/VoltGuardWidget
      - path: ../WidgetPack/Shared
    settings:
      base:
        PRODUCT_NAME: VoltGuardWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.voltguard.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: ../WidgetPack/VoltGuardWidget/Info.plist
      properties:
        CFBundleDisplayName: VoltGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
