name: WidgetPack
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  GlucoPulseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GlucoPulseWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: GlucoPulseWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.truenas.glucopulse.widget
        SKIP_INSTALL: "NO"
    info:
      path: GlucoPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: GlucoPulse
        CFBundleShortVersionString: "2.4.1"
        CFBundleVersion: "32"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  KeepwatchWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeepwatchWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: KeepwatchWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.keepwatch.nasdashboard.widget
