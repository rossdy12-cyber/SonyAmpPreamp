name: GlucoPulse
options:
  bundleIdPrefix: app.truenas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  GlucoPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: GlucoPulseWidget
    sources:
      - path: App
      - path: Views
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.truenas.glucopulse
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "21"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  GlucoPulseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GlucoPulseWidget
    settings:
      base:
        PRODUCT_NAME: GlucoPulseWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.truenas.glucopulse.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: GlucoPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: Glucose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
