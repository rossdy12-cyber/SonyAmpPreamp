workflows:
  ios-unsigned-ipa:
    name: Build & Publish OmniContainer v2.2 + J.A.R.V.I.S. v2.2 + DeskSwitch v2.0 (TrueNAS SideStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Build & Publish OmniContainer v2.2, JarvisWatch v2.2 & DeskSwitch v2.0 IPAs
        script: |
          set +e
          (
            set -e
            if ! command -v xcodegen &> /dev/null; then
              brew install xcodegen
            fi

            python3 - << 'EOF'
          import urllib.request, json, re

          def bump_project(proj_path, bundle_id, out_ver_file):
              with open(proj_path, "r") as f:
                  proj = f.read()
              cur_ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', proj).group(1)
              cur_bld = int(re.search(r'CURRENT_PROJECT_VERSION:\s*"([^"]+)"', proj).group(1))
              try:
                  req = urllib.request.Request("https://navidrome.nas-server.co.uk/sidestore/source.json", headers={"User-Agent": "SideStore/0.7.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      src = json.loads(r.read().decode())
                  existing = set()
                  for app in src.get("apps", []):
                      if app.get("bundleIdentifier") == bundle_id:
                          existing = {v["version"] for v in app.get("versions", [])}
                          break
              except Exception:
                  existing = set()
              if cur_ver in existing:
                  parts = [int(x) for x in cur_ver.split(".")]
                  while len(parts) < 3:
                      parts.append(0)
                  while f"{parts[0]}.{parts[1]}.{parts[2]}" in existing:
                      parts[2] += 1
                  cur_ver = f"{parts[0]}.{parts[1]}.{parts[2]}"
                  cur_bld += 1
                  proj = re.sub(r'MARKETING_VERSION:\s*"[^"]+"', f'MARKETING_VERSION: "{cur_ver}"', proj)
                  proj = re.sub(r'CURRENT_PROJECT_VERSION:\s*"[^"]+"', f'CURRENT_PROJECT_VERSION: "{cur_bld}"', proj)
                  with open(proj_path, "w") as f:
                      f.write(proj)
              with open(out_ver_file, "w") as f:
                  f.write(cur_ver)
              print(f"Prepared {bundle_id} version {cur_ver} (build {cur_bld})")

          bump_project("OmniContainer/project.yml", "com.ross.omnicontainer", "OmniContainer/.omni_version")
          bump_project("DeskSwitch/project.yml", "com.ross.deskswitch", "DeskSwitch/.ds_version")
          EOF

            # 1. Build OmniContainer v2.2.0 + Embedded J.A.R.V.I.S. Wrist OS v2.2.0
            cd OmniContainer
            xcodegen generate
            xcodebuild \
              -project OmniContainer.xcodeproj \
              -target OmniContainer \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

            tr -d '\r' < build_watch_bundle.sh > build_watch_bundle_lf.sh
            bash build_watch_bundle_lf.sh
            rm -f build_watch_bundle_lf.sh

            rm -rf Payload
            mkdir -p Payload
            cp -R build/Release-iphoneos/OmniContainer.app Payload/
            zip -r9 ../OmniContainer.ipa Payload
            cd ..

            # 2. Build DeskSwitch v2.0.0 (Unified PC, Aniimo Pilot, Farm Bot & LD Remote)
            cd DeskSwitch
            xcodegen generate
            xcodebuild \
              -project DeskSwitch.xcodeproj \
              -target DeskSwitch \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

            rm -rf Payload
            mkdir -p Payload
            cp -R build/Release-iphoneos/DeskSwitch.app Payload/
            zip -r9 ../DeskSwitch.ipa Payload
            cd ..
          ) > /tmp/cm_build.log 2>&1
          BUILD_STATUS=$?

          tail -n 120 /tmp/cm_build.log > /tmp/cm_tail.log
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @/tmp/cm_tail.log \
            "https://navidrome.nas-server.co.uk/sidestore-upload?buildLog=1" || true

          cat /tmp/cm_tail.log
          if [ $BUILD_STATUS -ne 0 ]; then
            exit $BUILD_STATUS
          fi

          OMNI_VER=$(cat OmniContainer/.omni_version)
          DS_VER=$(cat DeskSwitch/.ds_version)
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))')

          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @OmniContainer.ipa \
            "https://navidrome.nas-server.co.uk/sidestore-upload?bundleId=com.ross.omnicontainer&version=${OMNI_VER}&notes=${NOTES}"

          if [ -f JarvisWatch.ipa ]; then
            curl -fsSL -X POST \
              -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
              --data-binary @JarvisWatch.ipa \
              "https://navidrome.nas-server.co.uk/sidestore-upload?bundleId=com.ross.jarvis.watchkitapp&version=${OMNI_VER}&notes=${NOTES}"
          fi

          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @DeskSwitch.ipa \
            "https://navidrome.nas-server.co.uk/sidestore-upload?bundleId=com.ross.deskswitch&version=${DS_VER}&notes=${NOTES}"
    artifacts:
      - OmniContainer.ipa
      - JarvisWatch.ipa
      - DeskSwitch.ipa
