workflows:
  ios-unsigned-ipa:
    name: Build & Publish Auto-Updating iOS IPA (TrueNAS SideStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Build Unsigned Release iOS App
        script: |
          xcodebuild clean build \
            -project SonyAmpPreamp.xcodeproj \
            -scheme SonyAmpPreamp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Payload into SonyAmpPreamp.ipa
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SonyAmpPreamp.app Payload/
          zip -r9 SonyAmpPreamp.ipa Payload
      - name: Publish IPA & Update SideStore Source on TrueNAS
        script: |
          VERSION=$(python3 -c 'import re; print(re.search(r"MARKETING_VERSION:\s*\"([^\"]+)\"", open("project.yml").read()).group(1))')
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))')
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @SonyAmpPreamp.ipa \
            "https://navidrome.nas-server.co.uk/sidestore-upload?version=${VERSION}&notes=${NOTES}"
    artifacts:
      - SonyAmpPreamp.ipa
