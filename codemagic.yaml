workflows:
  ios-unsigned-ipa:
    name: Build & Publish GlucoPulse T1D iOS IPA (TrueNAS SideStore & LiveContainer)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Build & Publish GlucoPulse T1D IPA with Telemetry
        script: |
          set +e
          (
            set -e
            cd GlucoPulse
            python3 - << 'EOF'
          import urllib.request, json, re

          with open("project.yml", "r") as f:
              proj = f.read()

          cur_ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', proj).group(1)
          cur_bld = int(re.search(r'CURRENT_PROJECT_VERSION:\s*"([^"]+)"', proj).group(1))

          try:
              req = urllib.request.Request("https://navidrome.nas-server.co.uk/sidestore/source.json", headers={"User-Agent": "SideStore/0.7.0"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  src = json.loads(r.read().decode())
              existing = set()
              for app in src.get("apps", []):
                  if app.get("bundleIdentifier") == "app.truenas.glucopulse":
                      existing = {v["version"] for v in app.get("versions", [])}
                      break
          except Exception:
              existing = set()

          if cur_ver in existing:
              parts = [int(x) for x in cur_ver.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              while f"{parts[0]}.{parts[1]}.{parts[2]}" in existing:
                  parts[2] += 1
              cur_ver = f"{parts[0]}.{parts[1]}.{parts[2]}"
              cur_bld += 1
              proj = re.sub(r'MARKETING_VERSION:\s*"[^"]+"', f'MARKETING_VERSION: "{cur_ver}"', proj)
              proj = re.sub(r'CURRENT_PROJECT_VERSION:\s*"[^"]+"', f'CURRENT_PROJECT_VERSION: "{cur_bld}"', proj)
              with open("project.yml", "w") as f:
                  f.write(proj)

          with open(".build_version", "w") as f:
              f.write(cur_ver)
          print(f"Building GlucoPulse T1D version {cur_ver} (build {cur_bld})")
          EOF
            if ! command -v xcodegen &> /dev/null; then
              brew install xcodegen
            fi
            xcodegen generate
            xcodebuild clean build \
              -project GlucoPulse.xcodeproj \
              -scheme GlucoPulse \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
            mkdir -p Payload
            cp -r build/Build/Products/Release-iphoneos/GlucoPulse.app Payload/
            zip -r9 ../GlucoPulse.ipa Payload
          ) > /tmp/cm_build.log 2>&1
          BUILD_STATUS=$?

          tail -n 120 /tmp/cm_build.log > /tmp/cm_tail.log
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @/tmp/cm_tail.log \
            "https://navidrome.nas-server.co.uk/sidestore-upload?buildLog=1" || true

          cat /tmp/cm_tail.log
          if [ $BUILD_STATUS -ne 0 ]; then
            exit $BUILD_STATUS
          fi

          VERSION=$(cat GlucoPulse/.build_version)
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))')
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @GlucoPulse.ipa \
            "https://navidrome.nas-server.co.uk/sidestore-upload?bundleId=app.truenas.glucopulse&version=${VERSION}&notes=${NOTES}"
    artifacts:
      - GlucoPulse.ipa
