workflows:
  ios-unsigned-ipa:
    name: Build & Publish J.A.R.V.I.S. Wrist OS v2.2.4 (Apple Watch Series 10 HUD Fix)
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Compile J.A.R.V.I.S. Wrist OS v2.2.4 & Publish to TrueNAS
        script: |
          set +e
          (
            set -e
            cd OmniContainer
            mkdir -p build/Release-iphoneos/OmniContainer.app/Watch/OmniWatch.app
            tr -d '\r' < build_watch_bundle.sh > build_watch_bundle_lf.sh
            bash build_watch_bundle_lf.sh
            rm -f build_watch_bundle_lf.sh
            cd ..
          ) > /tmp/cm_build.log 2>&1
          BUILD_STATUS=$?

          tail -n 120 /tmp/cm_build.log > /tmp/cm_tail.log
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @/tmp/cm_tail.log \
            "https://navidrome.nas-server.co.uk/sidestore-upload?buildLog=1" || true

          cat /tmp/cm_tail.log
          if [ $BUILD_STATUS -ne 0 ]; then
            exit $BUILD_STATUS
          fi

          NOTES=$(git log -1 --pretty=%s | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))')
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @JarvisWatch.ipa \
            "https://navidrome.nas-server.co.uk/sidestore-upload?bundleId=com.ross.jarvis.watchkitapp&version=2.2.4&notes=${NOTES}"
    artifacts:
      - JarvisWatch.ipa
  nightfall-ios-ipa:
    name: Nightfall iPhone Browser — Build, Sign & Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes:
          - 'Nightfall/**'
          - 'codemagic.yaml'
    scripts:
      - name: Build unsigned Nightfall IPA on M2 and publish through TrueNAS
        script: |
          bash Nightfall/ci/build-and-publish.sh
    artifacts:
      - Nightfall/Nightfall.ipa
      - Nightfall/build-tail.log
      - Nightfall/publish-result.json