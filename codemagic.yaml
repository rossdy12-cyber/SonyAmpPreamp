# Single dispatcher workflow. Codemagic's `when: changeset` is ignored when builds are
# triggered via the Stark custom webhook (no commit range is delivered), so per-app
# changeset filters cannot scope builds. Instead we keep ONE workflow and detect the
# changed app folder(s) inside the script, building only those. One VM, only changed apps.
workflows:
  build-changed-apps:
    name: Build changed app(s) on M2 and publish through TrueNAS
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - sidestore
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Detect changed app folders from git and build only those
        script: |
          set -uo pipefail
          # Make sure we have history to diff against (Codemagic may clone shallow).
          git fetch --unshallow 2>/dev/null || git fetch --depth=50 2>/dev/null || true

          PREV="${CM_PREVIOUS_COMMIT:-}"
          CUR="${CM_COMMIT:-HEAD}"
          CHANGED=""
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$PREV" "$CUR" 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            # Fall back to the files in the most recent commit.
            CHANGED=$(git show --name-only --format="" "$CUR" 2>/dev/null | sed '/^$/d' || true)
          fi

          echo "===== Changed files ====="
          echo "$CHANGED"
          echo "========================="

          # Top-level folders that changed (an app lives in a top-level folder).
          APPS=$(echo "$CHANGED" | awk -F/ 'NF>1 {print $1}' | sort -u)
          echo "Candidate app folders: ${APPS:-<none>}"

          RC=0
          BUILT=0
          for app in $APPS; do
            SCRIPT=""
            if   [ -f "$app/build-and-publish.sh" ];    then SCRIPT="$app/build-and-publish.sh"
            elif [ -f "$app/ci/build-and-publish.sh" ]; then SCRIPT="$app/ci/build-and-publish.sh"
            fi
            if [ -z "$SCRIPT" ]; then
              echo ">> '$app' has no build-and-publish.sh — skipping (likely a config/non-app change)."
              continue
            fi
            echo "===== Building '$app' via $SCRIPT ====="
            if bash "$SCRIPT"; then
              echo "===== '$app' OK ====="
            else
              echo "!!!!! BUILD FAILED for '$app' !!!!!"
              RC=1
            fi
            BUILT=$((BUILT+1))
          done

          if [ "$BUILT" -eq 0 ]; then
            echo "No app folders with a build-and-publish.sh changed in this push — nothing to build."
          fi
          exit $RC
