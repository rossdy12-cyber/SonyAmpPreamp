workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA (SideStore / LiveContainer)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Build Unsigned Release iOS App
        script: |
          xcodebuild clean build \
            -project SonyAmpPreamp.xcodeproj \
            -scheme SonyAmpPreamp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Payload into SonyAmpPreamp.ipa
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SonyAmpPreamp.app Payload/
          zip -r9 SonyAmpPreamp.ipa Payload
    artifacts:
      - SonyAmpPreamp.ipa
