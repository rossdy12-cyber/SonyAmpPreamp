workflows:
  carbprep-unsigned-ipa:
    name: CarbPrep Native Xcode 16 Build & TrueNAS Auto-Sign
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes:
          - 'CarbPrep/**'
          - 'codemagic.yaml'
    scripts:
      - name: Compile native arm64 CarbPrep IPA on M2 and publish through TrueNAS
        script: |
          set +e
          (
            set -e
            bash CarbPrep/build-and-publish.sh
          ) > /tmp/cm_build.log 2>&1
          EXIT_CODE=$?
          cat /tmp/cm_build.log
          curl -fsSL -X POST \
            -H "X-Upload-Token: ss-deploy-9f8e7d6c5b4a3f2e1d0c" \
            --data-binary @/tmp/cm_build.log \
            "https://navidrome.nas-server.co.uk/sidestore-api/upload?buildLog=1" || true
          exit $EXIT_CODE
  nightfall-unsigned-ipa:
    name: Nightfall iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes:
          - 'Nightfall/**'
    scripts:
      - name: Build unsigned Nightfall IPA on M2 and publish through TrueNAS
        script: |
          bash Nightfall/ci/build-and-publish.sh
    artifacts:
      - Nightfall/Nightfall.ipa
      - Nightfall/build-tail.log
      - Nightfall/publish-result.json
